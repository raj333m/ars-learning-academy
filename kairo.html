<!DOCTYPE html>
<html lang="en" data-skin="sunrise">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kairo · ARS Learning Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* VOICE: a personal headhunter in your pocket — few words, confident, visual.
   IDEA: one guided conversation: upload → resume check → fill the gaps → matches, each step a living card.
   PICTURE: the agent's red orb, a resume scorecard (score ring, bars, skill chips, gap checklist), swipeable match cards.
   COLOUR and TYPE: dark-first ink with one warm red; fit shown in green/amber; Plus Jakarta Sans.
   LAYOUT: one 720px column, slim step rail under the header, thumb-reach answer dock, sheets for the rest. */
:root,[data-skin=sunrise]{color-scheme:light;--bg:#fff8f1;--panel:#ffffff;--ink:#1e1b3a;--mute:#6e6a86;--line:#efe3d5;--soft:#fbefe3;--acc:#e2550f;--acc2:#c2410c;--accsoft:#ffe8d6;--onacc:#fff;--good:#0e8a63;--goodsoft:#e2f5ec;--warn:#b46a00;--warnsoft:#fff1d9;--bad:#d93f3f;--shadow:0 12px 30px rgba(120,60,20,.10);--glow:rgba(242,107,29,.42);--orb:radial-gradient(circle at 34% 28%,#fff2c6 0,#ffc463 22%,#ff8a3d 48%,#e8461e 72%,#8f2410 100%);--bgfx:radial-gradient(1000px 560px at 50% -200px,rgba(255,170,90,.45),transparent 70%),radial-gradient(700px 420px at 100% 100%,rgba(255,214,170,.35),transparent 70%)}
[data-skin=ember]{color-scheme:dark;--bg:#0b0b0d;--panel:#151518;--ink:#f3f2f0;--mute:#9c9ca3;--line:#2a2a2f;--soft:#1f1f23;--acc:#db0011;--acc2:#ff3b4a;--accsoft:#2b1013;--onacc:#fff;--good:#3fd39b;--goodsoft:#0f2a21;--warn:#f4b350;--warnsoft:#2d2110;--bad:#ff4d5b;--shadow:0 10px 30px rgba(0,0,0,.45);--glow:rgba(219,0,17,.38);--orb:radial-gradient(circle at 32% 30%,#ff8a93 0,#ff2a3a 28%,#db0011 55%,#5c0007 100%);--bgfx:radial-gradient(900px 520px at 50% -180px,rgba(219,0,17,.22),transparent 70%)}
[data-skin=ocean]{color-scheme:dark;--bg:#061a22;--panel:#0c2731;--ink:#eaf6f8;--mute:#8fb0b8;--line:#173c48;--soft:#0f303b;--acc:#12b5ab;--acc2:#3fe0d4;--accsoft:#0e3a3c;--onacc:#03201f;--good:#43d39b;--goodsoft:#0d3027;--warn:#f4b350;--warnsoft:#33270f;--bad:#ff6b6b;--shadow:0 12px 30px rgba(0,0,0,.4);--glow:rgba(18,181,171,.42);--orb:radial-gradient(circle at 32% 28%,#d8fffb 0,#6ff1e6 22%,#12b5ab 50%,#0a5d78 78%,#062a3a 100%);--bgfx:radial-gradient(1000px 560px at 50% -200px,rgba(18,181,171,.30),transparent 70%)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bgfx) no-repeat,var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
a{color:var(--acc2)}
.col{width:min(720px,100%);margin:0 auto;padding:0 20px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header + steps */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .row{display:flex;align-items:center;gap:10px;height:60px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.arslink{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.arslink:hover{border-color:var(--acc);color:var(--acc2)}.arslink .ic{width:16px;height:16px}
.sp{flex:1}
.hbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.hbtn:hover{background:var(--soft)}
.hbtn[aria-pressed=true]{color:var(--acc2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 0 12px}
.steps div{font-size:12px;font-weight:600;color:var(--mute);display:grid;gap:6px}
.steps div::before{content:"";height:4px;border-radius:4px;background:var(--line)}
.steps .done::before{background:var(--good)}.steps .now::before{background:var(--acc)}.steps .now{color:var(--ink)}
/* orb */
.orb{--s:32px;width:var(--s);height:var(--s);border-radius:50%;flex:none;position:relative;background:var(--orb);box-shadow:0 6px 24px var(--glow)}
.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--glow);opacity:0}
.orb.busy{animation:breathe 1.6s ease-in-out infinite}.orb.busy::after{animation:ring 1.6s ease-out infinite}
.orb.listen{animation:breathe .7s ease-in-out infinite}.orb.listen::after{animation:ring .9s ease-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}@keyframes ring{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* hero */
.hero{min-height:calc(100svh - 140px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 0 40px}

.hero h1{font-size:clamp(32px,7vw,50px);line-height:1.06;letter-spacing:-.035em;margin:0 0 12px;font-weight:800;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--acc2)}
.hero p{font-size:17px;color:var(--mute);margin:0 0 30px;max-width:30ch}
.up{display:inline-flex;align-items:center;gap:10px;min-height:60px;padding:16px 30px;border-radius:999px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:17px;box-shadow:0 14px 34px var(--glow)}
.up:hover{transform:translateY(-2px)}
.hero small{display:block;margin-top:14px;color:var(--mute);font-size:13px}
/* stream */
#stream{padding:22px 0 6px}
.m{margin:0 0 18px;animation:rise .35s ease both}
.m.ai{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.m.ai .tx{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:3px}
.m.ai.q .tx{font-size:clamp(20px,4.6vw,24px);line-height:1.3;font-weight:700;letter-spacing:-.015em}
.m.me{display:flex;justify-content:flex-end}
.m.me .tx{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px 20px 6px 20px;max-width:85%;font-weight:500}
.filepill{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:16px;font-weight:600;box-shadow:var(--shadow)}
.filepill .ic{color:var(--acc2)}
.m.st{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:14px;padding-left:44px}
.m.st .ic{width:16px;height:16px;color:var(--good)}
.scanning{display:grid;gap:8px;padding-top:6px}
.scanning span{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--mute);opacity:.35;transition:opacity .3s}
.scanning span.on{opacity:1;color:var(--ink)}
.scanning span.ok .ic{color:var(--good)}
.thinking{display:inline-flex;gap:5px;padding-top:12px}.thinking i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1.2s infinite}.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-5px);opacity:.5}}
.stline{display:block;font-size:13px;color:var(--mute);margin-top:6px;font-weight:600}
/* card base */
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);margin:0 0 18px;animation:rise .45s ease both}
.ring{--p:0;--c:var(--mute);width:64px;height:64px;flex:none;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel)}
.ring b{position:relative;font-size:18px;font-weight:800;letter-spacing:-.02em}
.ring b small{font-size:11px}
.ring.g{--c:var(--good)}.ring.a{--c:var(--warn)}.ring.r{--c:var(--bad)}
.ring.g b{color:var(--good)}.ring.a b{color:var(--warn)}
.ring.big{width:112px;height:112px}.ring.big::before{inset:9px}.ring.big b{font-size:34px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--mute)}
.chip.g{background:var(--goodsoft);color:var(--good)}.chip.a{background:var(--warnsoft);color:var(--warn)}.chip.ink{background:var(--soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:none;margin:18px 0 8px;letter-spacing:.01em}
/* scan card */
.scan .sh{display:flex;gap:18px;align-items:center}
.scan h3{margin:0;font-size:20px;letter-spacing:-.02em;line-height:1.2}
.scan .who{color:var(--mute);font-size:14px;margin-top:4px}
.delta{display:inline-flex;margin-top:6px;font-size:12px;font-weight:700;color:var(--good);background:var(--goodsoft);padding:3px 8px;border-radius:999px}
.bars{display:grid;gap:10px;margin-top:18px}
.bar{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px;font-weight:600}
.bar span{color:var(--mute)}
.track{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:8px;background:var(--c,var(--good));width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar em{font-style:normal;text-align:right}
.strong{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.strong li{display:flex;gap:8px;align-items:flex-start}.strong .ic{width:16px;height:16px;color:var(--good);margin-top:2px}
.gaps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.gaps li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--soft);font-size:14px}
.gaps li b{font-weight:700}.gaps li small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.gaps .dot{width:12px;height:12px;border-radius:50%;background:var(--warn);justify-self:center}
.gaps li.ok .dot{background:var(--good)}
.gaps li.ok b{text-decoration:line-through;text-decoration-color:var(--mute)}
.gaps .val{font-size:12px;color:var(--good);font-weight:700;max-width:140px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:46px;padding:11px 18px;border-radius:999px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.p{background:var(--acc);color:var(--onacc)}
.btn.o{border:1.5px solid var(--line);color:var(--ink)}
.btn.o:hover{border-color:var(--ink)}
.btn.i{width:46px;padding:0;border:1.5px solid var(--line);color:var(--ink)}
.btn.i[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45}
/* match deck */
.deck{margin:0 -20px 12px;padding:4px 20px 14px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.jc{flex:0 0 min(310px,82vw);scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;animation:card .45s cubic-bezier(.2,.8,.2,1) both}
.jc:nth-child(2){animation-delay:.08s}.jc:nth-child(3){animation-delay:.16s}.jc:nth-child(n+4){animation-delay:.24s}
@keyframes card{from{opacity:0;transform:translateX(24px) scale(.97)}}
.jc.near{border-style:dashed}
.jh{display:flex;gap:14px;align-items:flex-start}
.co{font-size:13px;color:var(--mute);font-weight:600}
.jc h4{margin:2px 0 0;font-size:18px;line-height:1.25;letter-spacing:-.01em}
.why{margin:0;font-size:14px}
.gap{margin:0;font-size:13px;color:var(--mute)}
.practise{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--acc2);text-decoration:none;padding:8px 12px;border-radius:12px;background:var(--accsoft);align-self:flex-start}
.practise .ic{width:16px;height:16px}.practise{width:100%;text-align:left}.practise span{flex:1}.practise b{font-weight:800}
.practise.ok{background:var(--goodsoft);color:var(--good)}.practise.mid{background:var(--warnsoft);color:var(--warn)}.practise.low{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.jc .row{margin-top:auto;flex-wrap:nowrap}
.jc .btn.p{flex:1}
.more{flex:0 0 150px;scroll-snap-align:start;border:1.5px dashed var(--line);border-radius:24px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--mute);font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tool{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:14px;background:var(--panel)}
.tool:hover{border-color:var(--ink)}
.tool .ic{width:18px;height:18px}
.lc{padding:16px 20px}
.lc a{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
.lc a:first-of-type{border-top:0}
.lc a span{color:var(--mute);font-weight:500;white-space:nowrap}
/* dock */
.dock{position:sticky;bottom:0;z-index:15;background:linear-gradient(to top,var(--bg) 80%,transparent);padding:16px 0 calc(14px + env(safe-area-inset-bottom))}
.qmeta{font-size:12px;font-weight:700;color:var(--mute);margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.opt{min-height:48px;padding:12px 18px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);font-weight:600;font-size:15px;text-align:left;box-shadow:var(--shadow);animation:rise .3s ease both;transition:transform .12s,border-color .12s}
.opt:nth-child(2){animation-delay:.04s}.opt:nth-child(3){animation-delay:.08s}.opt:nth-child(4){animation-delay:.12s}.opt:nth-child(n+5){animation-delay:.16s}
.opt:hover{border-color:var(--ink);transform:translateY(-2px)}
.opt:active{transform:scale(.98)}
.opt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.done{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.opt.done:disabled{opacity:.4}
.bar2{display:flex;align-items:center;gap:10px}
.side{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--panel);flex:none}
.mic{width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;box-shadow:0 10px 26px var(--glow);flex:none;position:relative}
.mic .ic{width:24px;height:24px}
.mic.live::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--acc);animation:ring 1.2s ease-out infinite}
.mid{flex:1;text-align:center;color:var(--mute);font-size:13px;font-weight:500}
.typer{flex:1;display:flex;gap:8px}
.typer textarea{flex:1;min-height:48px;max-height:140px;resize:none;border:1.5px solid var(--line);border-radius:24px;padding:12px 18px;background:var(--panel);font-size:16px}
.send{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92svh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 0 calc(28px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 16px}
.sheet h2{font-size:26px;letter-spacing:-.03em;margin:0 0 4px;line-height:1.15}
.sheet .sub{color:var(--mute);font-size:14px;margin:0}
.menu{display:grid;gap:10px;margin-top:18px}
.mi{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-align:left;width:100%}
.mi .ico{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.mi b{display:block;font-size:15px}.mi small{color:var(--mute);font-size:13px}
.mi>div{flex:1}
.mi .ring{width:42px;height:42px}.mi .ring::before{inset:5px}.mi .ring b{font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .opt{box-shadow:none;min-height:44px;padding:10px 16px}
.field{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel);font-size:16px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;margin-top:16px}
.check input{width:20px;height:20px;accent-color:var(--acc);margin-top:1px;flex:none}
.flds{list-style:none;margin:0;padding:0}
.flds li{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;overflow-wrap:anywhere}
.flds li b{display:block;font-size:12px;color:var(--mute);font-weight:700;margin-bottom:2px}
.togs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 12px}
.togs label{display:flex;gap:10px;align-items:center;min-height:40px;font-size:14px}
.togs input{width:18px;height:18px;accent-color:var(--acc)}
.stars{display:flex;gap:10px}
.star{width:52px;height:52px;border-radius:16px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--mute);background:var(--panel)}
.star .ic{width:26px;height:26px}
.star.on{color:#f4b350;border-color:#f4b350}.star.on .ic{fill:#f4b350}
.note{font-size:13px;color:var(--mute)}
.gate{min-height:70svh;display:grid;place-items:center;text-align:center}
.hero{position:relative;overflow:hidden;margin-inline:calc(50% - 50vw);padding-inline:max(20px,calc(50vw - 340px));min-height:calc(100svh - 62px)}
.hero>*:not(.float):not(.dropzone){position:relative;z-index:1}
.float{position:absolute;inset:0;z-index:0;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 52% 44% at 50% 50%,transparent 55%,#000 92%);mask-image:radial-gradient(ellipse 52% 44% at 50% 50%,transparent 55%,#000 92%)}
.float span{position:absolute;bottom:-60px;white-space:nowrap;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);opacity:0;animation:drift var(--d,14s) linear infinite;animation-delay:var(--dl,0s)}
.float span b{color:var(--good);margin-left:6px}
@keyframes drift{0%{transform:translateY(0) scale(.92);opacity:0}12%{opacity:.9}70%{opacity:.7}100%{transform:translateY(calc(-100svh - 120px)) scale(1);opacity:0}}
.orbbtn{position:relative;width:200px;height:200px;display:grid;place-items:center;margin-bottom:26px;transition:transform .25s ease-out}
.orbbtn .orb{--s:132px;animation:breathe 3.2s ease-in-out infinite}
.orbbtn.talking .orb{animation:breathe .8s ease-in-out infinite}
.orbbtn .orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:sheen 3.6s ease-in-out infinite;mix-blend-mode:soft-light}
@keyframes sheen{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.halo{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0,transparent 68%);animation:halo 3.2s ease-in-out infinite}

<script>
/* Kairo on ARS Learning Academy: the same claude.use(...) services Kairo uses inside Claude,
   backed by this site's own server and the member's ARS sign-in (shared session = single sign-on). */
(function () {
  window.STANDALONE = true;
  const TK = "arsTok";
  const tok = () => { try { return localStorage.getItem(TK); } catch (e) { return null; } };
  async function api(path, body) {
    const r = await fetch("/api/" + path, { method: body !== undefined ? "POST" : "GET", headers: Object.assign({ "content-type": "application/json" }, tok() ? { authorization: "Bearer " + tok() } : {}), body: body !== undefined ? JSON.stringify(body) : undefined });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { const e = new Error(j.error || ("Request failed (" + r.status + ")")); e.code = j.code || ("http_" + r.status); e.status = r.status; throw e; }
    return j;
  }
  window.__arsApi = api;
  let session = null;
  async function ensure() {
    if (session) return session;
    if (tok()) { try { session = await api("auth?a=me"); } catch (e) { session = { uid: null, reg: false }; } }
    else session = { uid: null, reg: false };
    window.__arsSession = session; return session;
  }
  /* database (same API as ARS) */
  const clone = v => (v == null ? undefined : JSON.parse(JSON.stringify(v)));
  const snap = (id, data) => ({ id, exists: data != null, data: () => clone(data), metadata: { fromCache: false } });
  const watchers = new Set();
  const bump = path => { watchers.forEach(w => { if (path.startsWith(w.path)) w.run(); }); };
  function poll(path, fetcher, next, onErr, every) {
    let alive = true, timer = null, busy = false;
    const run = async () => { if (!alive || busy) return; busy = true; try { next(await fetcher()); } catch (e) { onErr && onErr(e); } busy = false; };
    const w = { path, run }; watchers.add(w);
    const loop = () => { if (!alive) return; timer = setTimeout(() => { if (!document.hidden) run(); loop(); }, every || 30000); };
    run(); loop();
    return () => { alive = false; clearTimeout(timer); watchers.delete(w); };
  }
  function docRef(path) {
    const id = path.split("/").pop();
    const ref = { id, path,
      get: async () => snap(id, (await api("db?op=get&path=" + encodeURIComponent(path))).data),
      set: async d => { await api("db", { op: "set", path, data: clone(d) }); bump(path); },
      update: async d => { await api("db", { op: "update", path, data: clone(d) }); bump(path); },
      delete: async () => { await api("db", { op: "delete", path }); bump(path); },
      onSnapshot: (next, err) => poll(path, () => ref.get(), next, err, 30000),
      collection: c => colRef(path + "/" + c) };
    return ref;
  }
  function colRef(cpath) {
    const q = { path: cpath,
      doc: id => docRef(cpath + "/" + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))),
      add: async d => { const r = q.doc(); await r.set(d); return r; },
      where() { return q; }, orderBy() { return q; }, limit() { return q; },
      get: async () => { const docs = ((await api("db?op=list&path=" + encodeURIComponent(cpath))).docs || []).map(d => snap(d.id, d.data)); return { docs, size: docs.length, empty: !docs.length }; },
      onSnapshot(next, err) { return poll(cpath + "/", () => q.get(), next, err, 30000); } };
    return q;
  }
  const db = { doc: docRef, collection: colRef };
  window.__kairoBump = bump;
  /* identity: the ARS member, with name and email from their ARS registration */
  async function arsProfile(uid) { try { const d = (await api("db?op=get&path=" + encodeURIComponent("attempts/" + uid))).data; return (d && d.profile) || {}; } catch (e) { return {}; } }
  const user = {
    id: async () => (await ensure()).uid,
    isOwner: async () => !!(await ensure()).admin, canEdit: async () => !!(await ensure()).admin, can: async () => true,
    me: async () => { const s = await ensure(); const p = s.uid ? await arsProfile(s.uid) : {}; return { id: s.uid, name: p.name || "", email: p.email || "", isOwner: !!s.admin }; },
    profiles: async ids => { const s = await ensure(); const out = {}; if (!s.admin) return out; await Promise.all((ids || []).map(async id => { const p = await arsProfile(id); out[id] = { id, name: p.name || "", email: p.email || "" }; })); return out; }
  };
  /* voice input: the browser's speech recognition, Indian English */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const dictation = SR ? (() => {
    const cb = {}; let rec = null, wanted = false, live = false;
    const emit = (k, v) => { try { cb[k] && cb[k](v); } catch (e) {} };
    return {
      start: () => new Promise((resolve, reject) => { try {
        rec = new SR(); rec.lang = "en-IN"; rec.continuous = true; rec.interimResults = true; wanted = true;
        rec.onstart = () => { live = true; emit("state", { state: "listening" }); resolve(); };
        rec.onresult = e => { let interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) emit("final", { text: " " + r[0].transcript.trim() }); else interim += r[0].transcript; } emit("partial", { text: interim }); };
        rec.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { wanted = false; const x = new Error("Microphone not allowed"); x.code = "not_granted"; reject(x); } };
        rec.onend = () => { if (wanted) { try { rec.start(); return; } catch (e) {} } live = false; emit("state", { state: "idle", reason: "stopped" }); };
        rec.start(); } catch (e) { reject(e); } }),
      stop: async () => { wanted = false; try { rec && rec.stop(); } catch (e) {} },
      active: () => live,
      onPartial: f => { cb.partial = f; }, onFinal: f => { cb.final = f; }, onState: f => { cb.state = f; }
    };
  })() : null;
  /* spoken replies: the browser's voices, preferring a female Indian English voice */
  const tts = ("speechSynthesis" in window) ? (() => {
    let cb = null, speaking = false;
    const FEM = /female|neerja|veena|heera|swara|raveena|aditi|kajal|priya|isha|ananya|lekha|google.*india/i;
    const pick = () => { const vs = speechSynthesis.getVoices(), inV = vs.filter(v => /en[-_]IN/i.test(v.lang)); return inV.find(v => FEM.test(v.name)) || inV[0] || vs.find(v => /^en/i.test(v.lang) && FEM.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null; };
    try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) {}
    return {
      speak: (text, o) => new Promise((res, rej) => {
        try { speechSynthesis.cancel(); } catch (e) {}
        const u = new SpeechSynthesisUtterance(String(text)), v = pick();
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-IN";
        u.rate = (o && o.rate) || 1; u.pitch = 1.05;
        u.onstart = () => { speaking = true; cb && cb({ state: "speaking" }); };
        u.onend = () => { speaking = false; cb && cb({ state: "idle", reason: "completed" }); res({ playedMs: 0 }); };
        u.onerror = () => { speaking = false; cb && cb({ state: "idle", reason: "stopped" }); rej({ code: "stopped" }); };
        speechSynthesis.speak(u);
      }),
      stop: async () => { try { speechSynthesis.cancel(); } catch (e) {} speaking = false; },
      active: () => speaking,
      onState: f => { cb = f; return () => { cb = null; }; }
    };
  })() : null;
  /* downloads */
  const downloads = { save: async ({ filename, data }) => { const blob = data instanceof Blob ? data : new Blob([data]); const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = filename || "download"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000); return { status: "saved" }; } };
  const ready = name => api(name).then(r => !!r.ready).catch(() => false);
  window.claude = { use: async name => {
    switch (name) {
      case "user": await ensure(); return user;
      case "db": { const s = await ensure(); return s.reg ? db : null; }
      case "dictation": return dictation;
      case "tts": return tts;
      case "downloads": return downloads;
      default: return null;
    }
  } };
})();
</script>

  const el = $('#roleWord'); let w = 0, c = ROLES[0].length, del = false;
  if (!reduce) setInterval(() => {
    if (!$('#hero') || $('#hero').hidden) return;
    const word = ROLES[w];
    if (!del) { c++; if (c > word.length) { del = true; c = word.length + 6; } }
    else { c--; if (c <= 0) { del = false; w = (w + 1) % ROLES.length; c = 0; } }
    el.textContent = ROLES[w].slice(0, Math.max(0, Math.min(c, ROLES[w].length))) || '​';
  }, 85);
  const ob = $('#startBtn');
  if (!reduce) addEventListener('pointermove', e => { if (!$('#hero') || $('#hero').hidden) return; const r = ob.getBoundingClientRect(), dx = (e.clientX - (r.left + r.width / 2)) / innerWidth, dy = (e.clientY - (r.top + r.height / 2)) / innerHeight; ob.style.transform = `translate(${dx * 26}px,${dy * 26}px)`; });
  const hero = $('#hero');
  addEventListener('dragover', e => { if (!hero.isConnected || hero.hidden) return; e.preventDefault(); hero.classList.add('drag'); });
  addEventListener('dragleave', e => { if (!e.relatedTarget) hero.classList.remove('drag'); });
  addEventListener('drop', e => { e.preventDefault(); hero.classList.remove('drag'); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) takeResume(f); });
})();
$('#startBtn').onclick = () => { greeted = true; if (!tts || !voiceOn) { $('#heroUp').focus(); return toast('Voice is off here — tap Upload resume'); } greet(); };
$('#heroUp').addEventListener('click', () => { if (!greeted && voiceOn) { greeted = true; speak('Great. Pick your resume — PDF or Word.'); } });
function initVoice() {
  $('#kbBtn').hidden = !!dict;
  if (dict) {
    $('#micBtn').hidden = false;
    dict.onState(({state}) => {
      const live = state === 'listening' || state === 'starting';
      $('#micBtn').classList.toggle('live', live); $('#hOrb').classList.toggle('listen', live);
      if (live) { $('#mid').textContent = 'Listening…'; clearInterval(silenceT); silenceT = setInterval(() => { if (heard.trim() && Date.now() - lastHeard > 1400) dict.stop().catch(() => {}); }, 300); }
      if (state === 'idle') { clearInterval(silenceT); const t = heard.trim(); heard = ''; if (autoSend && t) heardAnswer(t); autoSend = false; if (!busy) renderOpts(); }
    });
    dict.onPartial(({text}) => { if (text) { lastHeard = Date.now(); $('#mid').textContent = '“' + (heard + ' ' + text).trim().slice(-70) + '”'; } });
    dict.onFinal(({text}) => { heard += text; lastHeard = Date.now(); $('#mid').textContent = '“' + heard.trim().slice(-70) + '”'; });
  }
  if (tts) {
    $('#ttsBtn').hidden = false;
    try { voiceOn = localStorage.getItem('kairo-voice') !== '0'; } catch {}
    $('#ttsBtn').setAttribute('aria-pressed', voiceOn);
    tts.onState(({state, reason}) => {
      const on = state === 'speaking' || state === 'starting';
      $('#hOrb').classList.toggle('busy', on || busy); $('#startBtn').classList.toggle('talking', on);
      if (state === 'idle' && reason === 'completed' && dict && !busy && !$('#dock').hidden) { $('#micBtn').classList.add('invite'); $('#mid').textContent = 'Tap the mic and answer'; }
    });
  } else voiceOn = false;
}

/* ---------- start ---------- */
function gate(msg) { $('#main').innerHTML = `<div class="gate"><div><span class="orb" style="--s:84px;display:inline-block;margin-bottom:22px"></span><h2 style="font-size:28px;margin:0 0 8px">Kairo is unavailable</h2><p class="note">${esc(msg || 'Please reload the page.')}</p></div></div>`; $('#dock').hidden = true; }
render();
(async () => {
  if (!window.claude) return gate();
  [db, user, sample, mcp, dict, tts, dl] = await Promise.all(['db', 'user', 'sample', 'mcp', 'dictation', 'tts', 'downloads'].map(n => claude.use(n).catch(() => null)));
  if (!db || !user) {
    const s = window.__arsSession || {};
    if (!s.reg) {
      $('#main').innerHTML = `<div class="gate"><div><span class="orb" style="--s:84px;display:inline-block;margin-bottom:22px"></span><h2 style="font-size:28px;margin:0 0 8px">Sign in with your ARS account</h2><p class="note" style="margin:0 0 22px">One account for interview practice and job matching.</p><button class="up" id="goSign" style="animation:none">Sign in or register free</button></div></div>`;
      $('#dock').hidden = true;
      $('#goSign').onclick = () => { try { localStorage.setItem('arsNext', '/kairo'); } catch {} location.href = '/'; };
      return;
    }
    return gate('Kairo couldn\'t reach the ARS server. Check your connection and reload.');
  }
  uid = await user.id(); if (!uid) return gate();
  try { const me = await user.me(); if (me) { myName = me.name || ''; myEmail = me.email || ''; } } catch {}
  isOwner = !!(await user.isOwner().catch(() => false));
  if (myName) $('#hiName').textContent = `Hi ${myName.split(' ')[0]},`;
  try {
    const [ps, cs, fs] = await Promise.all([profRef().get(), chatRef().get(), fbRef().get()]); const ss = {exists:false}, ls = {exists:false};
    if (ps.exists) { const d = ps.data(); profile = {...profile, ...d, prefs:{...DEF, ...(d.prefs || {})}, fields:Array.isArray(d.fields) ? [...d.fields] : profile.fields, answered:{...(d.answered || {})}}; hunt = d.hunt || null; }
    if (cs.exists) turns = [...(cs.data().turns || [])];
    if (ss.exists) { const {resumeText, prefs, fields, ...rest} = ss.data(); schedule = {...rest}; }
    if (fs.exists) myFeedback = [...(fs.data().entries || [])];
    if (ls.exists) learnings = {...ls.data()};
  } catch {}
  try { const a = await db.doc('attempts/' + uid).get(); ars = a.exists ? a.data() : null; } catch {}
  if (ars && ars.profile && profile.prefs.expMin == null && Number(ars.profile.totalExp)) { profile.prefs.expMin = Math.max(0, Number(ars.profile.totalExp) - 2); profile.prefs.expMax = Number(ars.profile.totalExp) + 4; }
  try { const us = await usageRef().get(); usage = us.exists ? {...us.data()} : {}; } catch {}
  track({firstSeen:usage.firstSeen || Date.now(), device:matchMedia('(max-width:700px)').matches ? 'mobile' : 'desktop', skin, stage:usage.stage || 0}, {visits:1});
  addEventListener('pointerdown', () => { if (!greeted && profile.resumeText && voiceOn) { greeted = true; setTimeout(greet, 60); } }, {once:true, capture:true});
  if (profile.resumeText && !turns.some(t => t.role === 'scan') && profile.scan) turns.push({role:'scan', snap:profile.scan});
  initVoice();
  let first = true;
  await loadFeed();
  if (profile.resumeText && turns.length) {
    const fresh = profile.lastScoredAt ? [...jobs.values()].filter(j => j.status !== 'closed' && Date.parse(j.addedOn || 0) > profile.lastScoredAt - 864e5).length : 0;
    const wo = [...new Set([...(fresh ? ['Find new matches'] : []), ...defaultOpts().items])].slice(0, 4);
    turns.push({role:'assistant', local:true, content:`Welcome back${myName ? ', ' + myName.split(' ')[0] : ''}.${fresh ? ` ${fresh} new role${fresh === 1 ? '' : 's'} since your last visit.` : ''}\nOPTIONS: ${wo.join(' | ')}`});
  }
  render();
  matchCol().onSnapshot(s => { matches.clear(); for (const d of s.docs) matches.set(d.id, {...d.data(), id:d.id}); render(); }, () => {});
  render();
})();
}
</script>
